on:
  workflow_dispatch:
    inputs:
      account:
        description: "Instagram account stored in repository secrets"
        required: true
        default: "PIERREMINIGGIO"
      video_url:
        description: "Video URL"
        required: true
        default: "https://storage.miniggiodev.fr/test/story.mp4"
      proxy:
        description: "Proxy"
        required: true
        default: "http://toulouse.ggio.fr:808"

name: Upload Story
jobs:
  get:
    name: Upload Story
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt update
      - run: pip install "instagrapi[video]" Pillow
      - run: pip install --no-deps "moviepy==2.2.1"
      - run: sudo apt-get install ffmpeg
      - run: python main.py "$username" "$password" "$video_url" "$proxy" "$instagram_code_beggar_api_url" "$instagram_code_beggar_api_token" "$session_json" > upload.json
        env:
          username: ${{ secrets[format('{0}{1}', 'USERNAME_', github.event.inputs.account)] }}
          password: ${{ secrets[format('{0}{1}', 'PASSWORD_', github.event.inputs.account)] }}
          video_url: ${{ github.event.inputs.video_url }}
          proxy: ${{ github.event.inputs.proxy }}
          instagram_code_beggar_api_url: ${{ secrets.INSTAGRAM_CODE_BEGGAR_API_URL }}
          instagram_code_beggar_api_token: ${{ secrets.INSTAGRAM_CODE_BEGGAR_API_TOKEN }}
          session_json: ${{ secrets[format('{0}{1}', 'SESSION_', github.event.inputs.account)] }}

      - name: Persist Instagram session
        if: always()
        run: |
          if [ -f session.json ] && [ -n "$GH_TOKEN" ]; then
            gh secret set "SESSION_${{ github.event.inputs.account }}" --body "$(cat session.json)" --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}

      - uses: actions/upload-artifact@v4
        with:
          name: upload.json
          path: upload.json
